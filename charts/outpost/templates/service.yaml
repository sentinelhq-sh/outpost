{{- if .Values.config.prometheusAddr }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "outpost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "outpost.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
{{- end }}
