{{- if and .Values.config.apiKey (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outpost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.config.apiKey | quote }}
{{- end }}
