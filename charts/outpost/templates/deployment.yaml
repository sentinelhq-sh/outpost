apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "outpost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outpost.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "outpost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "outpost.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "outpost.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outpost
          image: {{ include "outpost.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SENTINELHQ_AGENT_MODE
              value: {{ .Values.config.agentMode | quote }}
            - name: SENTINELHQ_CLUSTER_NAME
              value: {{ .Values.config.clusterName | quote }}
            # One Helm release = ONE logical agent. The release-derived name is
            # stable across all pods and redeploys, so the backend sees a single
            # agent; K8s HA between pods stays invisible to it. Pod-local
            # identity (machine-id/hostname) must NOT leak here, or each pod
            # would register as a separate agent.
            - name: SENTINELHQ_FINGERPRINT
              value: {{ .Values.config.fingerprint | default (printf "k8s/%s/%s" .Release.Namespace (include "outpost.fullname" .)) | quote }}
            - name: SENTINELHQ_AGENT_NAME
              value: {{ .Values.config.agentName | default (include "outpost.fullname" .) | quote }}
            - name: SENTINELHQ_POLL_INTERVAL
              value: {{ .Values.config.pollInterval | quote }}
            - name: SENTINELHQ_HTTP_TIMEOUT
              value: {{ .Values.config.httpTimeout | quote }}
            {{- if .Values.config.apiUrl }}
            - name: SENTINELHQ_API_URL
              value: {{ .Values.config.apiUrl | quote }}
            {{- end }}
            {{- if or .Values.config.apiKey .Values.existingSecret }}
            - name: SENTINELHQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (include "outpost.fullname" .) }}
                  key: {{ .Values.existingSecretKey }}
            {{- end }}
            - name: SENTINELHQ_ADDR
              value: {{ .Values.config.addr | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "outpost.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
        {{- end }}
