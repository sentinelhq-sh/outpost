replicaCount: 2

image:
  repository: ghcr.io/sentinelhq-sh/outpost
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: "sentinelhq-outpost"

config:
  # agentMode: sentinel (push to backend) | prometheus (metrics only)
  # /metrics is always exposed on prometheusAddr regardless of mode.
  agentMode: "sentinel"
  clusterName: "default"
  apiUrl: ""
  apiKey: ""
  addr: ":8080"
  pollInterval: "5m"
  httpTimeout: "10s"

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Secret holding SENTINELHQ_API_KEY.
# If set, the chart references this existing secret instead of creating one.
existingSecret: ""
existingSecretKey: "api-key"

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
# Override to replace the default hostname anti-affinity.
affinity: {}

# Liveness / readiness probes against the healthz server (:9090).
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

# Prometheus ServiceMonitor (requires prometheus-operator CRDs).
serviceMonitor:
  enabled: false
  namespace: ""
  interval: "30s"
  scrapeTimeout: "10s"
  labels: {}
